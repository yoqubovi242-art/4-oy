<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunlik Yangiliklar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background-color: #fdfbf7;
            color: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

      
        header {
            text-align: center;
            padding: 25px 20px 15px 20px;
            border-bottom: 2px solid #800020;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #111;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        nav a {
            text-decoration: none;
            color: #800020;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            flex: 1;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            gap: 25px;
        }

        .article-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 25px;
            flex: 1;
            border-radius: 4px;
        }

        .date {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .article-card h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #111;
        }

        .article-card p {
            font-size: 15px;
            color: #333;
            line-height: 1.4;
        }

        /* Footer qismi */
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 25px 20px;
            font-size: 14px;
        }

        footer .footer-links {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

       
        @media (max-width: 900px) {
            main {
                flex-direction: column; 
            }
        }

        
        @media (max-width: 600px) {
            header h1 {
                font-size: 26px;
            }

            nav {
                flex-direction: column; 
                gap: 10px;
            }

            nav a {
                font-size: 16px;
            }

            .article-card {
                padding: 15px;
            }

            footer .footer-links {
                flex-direction: column; 
                gap: 8px;
            }
        }
    </style>
</head>
<body>

   
    <header>
        <h1>Kunlik Yangiliklar</h1>
        <nav>
            <a href="#">Texnologiya</a>
            <a href="#">Sport</a>
            <a href="#">Ta'lim</a>
        </nav>
    </header>


    <main>
        <div class="article-card">
            <div class="date">24-sentabr, 2026</div>
            <h2>Birinchi maqola sarlavhasi</h2>
            <p>Maqola matnining qisqacha qismi shu yerda ko'rsatiladi.</p>
        </div>

        <div class="article-card">
            <div class="date">23-sentabr, 2026</div>
            <h2>Ikkinchi maqola sarlavhasi</h2>
            <p>Maqola matnining qisqacha qismi shu yerda ko'rsatiladi.</p>
        </div>
    </main>

  
    <footer>
        <div> 2026 Kunlik Yangiliklar</div>
        <div class="footer-links">
            <a href="#">Telegram</a>
            <a href="#">Instagram</a>
        </div>
    </footer>

</body>
</html>
